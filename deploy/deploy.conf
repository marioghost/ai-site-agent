# AI Site Agent — deployment manager configuration
# Sourced by deploy/manage_deploy.sh. Override any variable in the environment
# or create deploy/deploy.local.conf (gitignored) for machine-specific paths.

# --- Paths ---
# Default: repo root when running from a git checkout; override to /opt/ai-site-agent in production.
PROJECT_ROOT="${PROJECT_ROOT:-}"
BACKEND_DIR="${BACKEND_DIR:-${PROJECT_ROOT}/backend}"
DASHBOARD_DIR="${DASHBOARD_DIR:-${PROJECT_ROOT}/dashboard}"
VENV_DIR="${VENV_DIR:-${BACKEND_DIR}/.venv}"
FRONTEND_BUILD_DIR="${FRONTEND_BUILD_DIR:-${DASHBOARD_DIR}/dist}"
ENV_FILE="${ENV_FILE:-${PROJECT_ROOT}/.env}"
BACKUP_DIR="${BACKUP_DIR:-${PROJECT_ROOT}/backups}"
LOG_DIR="${LOG_DIR:-${PROJECT_ROOT}/logs}"

# When manage_deploy.sh is started from /opt, set this to your editable checkout so
# "Full/Frontend/Backend deploy" rsyncs FROM here INTO PROJECT_ROOT.
# Example: DEV_CHECKOUT="/home/you/projects/ai-site-agent"
# Leave empty when you always run manage_deploy from the checkout itself.
DEV_CHECKOUT="${DEV_CHECKOUT:-}"

# --- Services (systemd unit names) ---
BACKEND_SERVICE_NAME="${BACKEND_SERVICE_NAME:-ai-agent-backend}"
NGINX_SERVICE_NAME="${NGINX_SERVICE_NAME:-nginx}"
QDRANT_SERVICE_NAME="${QDRANT_SERVICE_NAME:-qdrant}"
OLLAMA_SERVICE_NAME="${OLLAMA_SERVICE_NAME:-ollama}"
# Optional future services (leave empty to skip in start/stop/status):
SCHEDULER_SERVICE_NAME="${SCHEDULER_SERVICE_NAME:-}"
WORKER_SERVICE_NAME="${WORKER_SERVICE_NAME:-}"

# --- Operations manager: which modules to control ---
MANAGE_BACKEND="${MANAGE_BACKEND:-true}"
MANAGE_NGINX="${MANAGE_NGINX:-true}"
MANAGE_OLLAMA="${MANAGE_OLLAMA:-true}"
MANAGE_QDRANT="${MANAGE_QDRANT:-true}"

# --- Runtime ---
HEALTHCHECK_URL="${HEALTHCHECK_URL:-http://127.0.0.1:8000/api/health}"
APP_USER="${APP_USER:-www-data}"
APP_GROUP="${APP_GROUP:-www-data}"

# --- Qdrant (from .env or defaults) ---
QDRANT_HOST="${QDRANT_HOST:-127.0.0.1}"
QDRANT_PORT="${QDRANT_PORT:-6333}"
DEFAULT_QDRANT_COLLECTION="${DEFAULT_QDRANT_COLLECTION:-site_knowledge}"

# --- Behaviour defaults ---
GIT_PULL_DEFAULT="${GIT_PULL_DEFAULT:-yes}"
BACKUP_DB_DEFAULT="${BACKUP_DB_DEFAULT:-yes}"
NPM_INSTALL_DEFAULT="${NPM_INSTALL_DEFAULT:-yes}"
RELOAD_NGINX_DEFAULT="${RELOAD_NGINX_DEFAULT:-yes}"

# --- Staging install (optional alternative to git pull in /opt) ---
STAGING_DIR="${STAGING_DIR:-/tmp/ai-site-agent-deploy}"
USE_STAGING="${USE_STAGING:-no}"

# --- Node.js (frontend build) ---
# Optional explicit paths when npm is not on PATH (common with sudo + nvm):
# NPM_BIN="/home/you/.nvm/versions/node/v20.20.2/bin/npm"
# NODE_BIN="/home/you/.nvm/versions/node/v20.20.2/bin/node"
NPM_BIN="${NPM_BIN:-}"
NODE_BIN="${NODE_BIN:-}"
