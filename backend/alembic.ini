# Alembic configuration — PostgreSQL schema management.
#
# The application schema is owned by these migrations. The backend verifies on
# startup that the database is migrated to the latest head and refuses to start
# otherwise. There is no runtime auto-create.
#
# Usage (from the backend directory, with the project venv):
#   alembic upgrade head            # apply migrations
#   alembic revision --autogenerate -m "describe change"
#   alembic current                 # show current revision
#
# The database URL is read from the application config (DATABASE_URL) in
# migrations/env.py — do not hardcode credentials here.

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is intentionally left blank: migrations/env.py loads it from
# DATABASE_URL via the application config.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
