name: Release test

on:
  push:
    branches: [main, master, develop, 'release/**']
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Backend unit tests
        run: make test-backend

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Dashboard tests and build
        run: make test-dashboard

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai_agent
          POSTGRES_PASSWORD: test_secret
          POSTGRES_DB: ai_site_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_agent -d ai_site_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Migration test
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://ai_agent:test_secret@127.0.0.1:5432/ai_site_agent_test
        run: make test-migration
